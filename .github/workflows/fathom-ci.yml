name: Fathom CI

# Format, unit tests (both flavors) and instrumentation-test compile on every push and pull request.
# Upstream "Android CI/CD" stays disabled: it builds and publishes with Flow's signing keys.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Layout, runner, JDK and Gradle setup follow upstream's build.yml (#1372): formatting and
# tests run on separate runners at the same time, with the CI Gradle properties in place
# of --max-workers=1. The tests job writes the Gradle cache; formatting only restores it.
jobs:
  checks:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # Spotless ratchetFrom compares against an old commit.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      # Read-only: the repository cache is near its 10 GB cap, and the tests job writes the entry.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Kotlin formatting
        run: >
          ./gradlew spotlessCheck
          --build-cache --stacktrace

  tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Instrumentation tests are not executed in CI, but breakage there otherwise lands on main unnoticed.
      - name: Run unit tests and compile instrumentation tests
        run: >
          ./gradlew :app:testGithubDebugUnitTest :app:testFossDebugUnitTest
          :app:compileGithubDebugAndroidTestKotlin
          --build-cache --stacktrace

      - name: Upload unit test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests
            app/build/test-results
          retention-days: 7
