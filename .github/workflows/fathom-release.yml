name: Fathom release

# Run from the Actions tab ("Fathom release"), tag e.g. v2.2.1.
# Tag must match versionName in app/build.gradle.kts (the in-app updater compares it).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v2.2.1'
        required: true
        type: string
      prerelease:
        description: 'Mark it as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: fathom-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check the tag
        run: |
          set -euo pipefail
          case "$TAG" in v[0-9]*) ;; *) echo "::error::The tag must look like v2.2.1"; exit 1 ;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release named $TAG already exists"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::The tag $TAG already exists, so the release would point at old code. Pick a new version."
            exit 1
          fi

      - name: Check out the code
        uses: actions/checkout@v7

      - name: Match the tag to the app version
        run: |
          set -euo pipefail
          version=$(grep -m1 -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode the signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set. Add the signing key secrets first, or the APK would be unsigned and could not be installed."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Build the APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleGithubRelease :app:assembleFossRelease --max-workers=1 --build-cache --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # In-app updater picks by name: fathom.apk = universal, fathom-<abi>.apk = per CPU; do not rename.
      # foss builds (no updater, no Discord): fathom-foss*.apk, never picked.
      - name: Name the APKs
        run: |
          set -euo pipefail
          github=app/build/outputs/apk/github/release
          foss=app/build/outputs/apk/foss/release
          mkdir dist
          cp "$github/app-github-universal-release.apk"   dist/fathom.apk
          cp "$github/app-github-arm64-v8a-release.apk"   dist/fathom-arm64-v8a.apk
          cp "$github/app-github-armeabi-v7a-release.apk" dist/fathom-armeabi-v7a.apk
          cp "$foss/app-foss-universal-release.apk"       dist/fathom-foss.apk
          cp "$foss/app-foss-arm64-v8a-release.apk"       dist/fathom-foss-arm64-v8a.apk
          cp "$foss/app-foss-armeabi-v7a-release.apk"     dist/fathom-foss-armeabi-v7a.apk
          (cd dist && sha256sum fathom*.apk > checksums.txt && cat checksums.txt)

      # Updates need the same signing certificate: a wrong key must stop the release.
      # Value = SHA-256 of Fathom's signing certificate; change only on deliberate key rotation.
      - name: Confirm the APKs are signed with the Fathom key
        env:
          EXPECTED_SIGNER_SHA256: 2e3571c4f521f71c655042d9d96fbd11c295b74e288e2f317266cd61932174ea
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          status=0
          for apk in dist/*.apk; do
            "$apksigner" verify "$apk"
            actual=$("$apksigner" verify --print-certs "$apk" | grep -m1 "certificate SHA-256 digest" | awk '{print $NF}')
            if [ "$actual" != "$EXPECTED_SIGNER_SHA256" ]; then
              echo "::error::$(basename "$apk") is signed with '$actual', expected '$EXPECTED_SIGNER_SHA256'"
              status=1
            else
              echo "OK $(basename "$apk") -> $actual"
            fi
          done
          exit $status

      - name: Publish the release
        run: |
          set -euo pipefail
          # Create the tag first: letting the release create it is refused with a 403 on this repository.
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          flags=(--repo "$GITHUB_REPOSITORY" --title "Fathom $TAG" --generate-notes)
          if [ "${{ inputs.prerelease }}" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" dist/*.apk dist/checksums.txt "${flags[@]}"

      - name: Refresh the badges
        run: gh workflow run fathom-badges.yml --repo "$GITHUB_REPOSITORY" --ref main
