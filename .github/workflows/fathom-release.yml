name: Fathom release

# Run it from the Actions tab: "Fathom release" -> "Run workflow", and type the tag (for example v2.2.1).
# The tag must match versionName in app/build.gradle.kts, which is what the in-app updater compares.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v2.2.1'
        required: true
        type: string
      prerelease:
        description: 'Mark it as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: fathom-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check the tag
        run: |
          set -euo pipefail
          case "$TAG" in v[0-9]*) ;; *) echo "::error::The tag must look like v2.2.1"; exit 1 ;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release named $TAG already exists"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::The tag $TAG already exists, so the release would point at old code. Pick a new version."
            exit 1
          fi

      - name: Check out the code
        uses: actions/checkout@v7

      - name: Match the tag to the app version
        run: |
          set -euo pipefail
          version=$(grep -m1 -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode the signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set. Add the signing key secrets first, or the APK would be unsigned and could not be installed."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Build the APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleGithubRelease --max-workers=1 --build-cache --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # The in-app updater picks an APK by these names: fathom.apk is the universal build,
      # fathom-<abi>.apk the one for a device's CPU. Do not rename them.
      - name: Name the APKs for the updater
        run: |
          set -euo pipefail
          out=app/build/outputs/apk/github/release
          mkdir dist
          cp "$out/app-github-universal-release.apk"   dist/fathom.apk
          cp "$out/app-github-arm64-v8a-release.apk"   dist/fathom-arm64-v8a.apk
          cp "$out/app-github-armeabi-v7a-release.apk" dist/fathom-armeabi-v7a.apk
          (cd dist && sha256sum fathom*.apk > checksums.txt && cat checksums.txt)

      - name: Confirm the APKs are signed
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          for apk in dist/*.apk; do
            "$apksigner" verify "$apk"
            echo "$apk: $("$apksigner" verify --print-certs "$apk" | grep -m1 "SHA-256 digest")"
          done

      - name: Publish the release
        run: |
          set -euo pipefail
          # Create the tag first: letting the release create it is refused with a 403 on this repository.
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          flags=(--repo "$GITHUB_REPOSITORY" --title "Fathom $TAG" --generate-notes)
          if [ "${{ inputs.prerelease }}" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" dist/fathom.apk dist/fathom-arm64-v8a.apk dist/fathom-armeabi-v7a.apk dist/checksums.txt "${flags[@]}"
