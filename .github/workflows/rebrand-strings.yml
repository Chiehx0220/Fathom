name: Rebrand strings

# Fails when generated Fathom strings (app/src/fathom/res/values-*/strings.xml) differ from
# what scripts/rebrand-strings.js writes from upstream translations. Generated, not hand-edited:
# Fathom wording goes in fathom_strings.xml, then run
#   node scripts/rebrand-strings.js
# Also run it, and --report, after every upstream merge.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strings:
    name: Check the generated strings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Compare with the generator's output
        run: node scripts/rebrand-strings.js --check

      - name: List "Flow" nobody has decided on
        run: node scripts/rebrand-strings.js --report
