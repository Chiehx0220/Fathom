name: Fork diff budget

# Fails when upstream-owned code edited by the fork grows (merge-conflict surface).
# Put new code in a new file, leave only a call in the upstream file.
# After a cleanup: node scripts/fork-diff.js --update-budget

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  budget:
    name: Check the budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch upstream Flow
        run: |
          git remote add upstream https://github.com/A-EDev/Flow.git
          git fetch --no-tags upstream main

      - name: Compare with the budget
        run: node scripts/fork-diff.js --check

      - name: Check that FORK-DIFF.md is current
        run: node scripts/fork-diff.js --check-doc
