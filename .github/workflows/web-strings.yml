name: Web strings

# Web UI strings (assets/web/app/strings/*.json) against the scripts that use them, plus the web tests.
#   node scripts/check-web-strings.js --report
#   npm ci --prefix scripts/web-tests && node --test scripts/web-tests/*.test.js

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strings:
    name: Check the web strings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Compare the strings with the page
        run: node scripts/check-web-strings.js --report

      - name: Install the web test dependencies
        run: npm ci --prefix scripts/web-tests --no-audit --no-fund

      - name: Run the web tests
        run: node --test scripts/web-tests/*.test.js
