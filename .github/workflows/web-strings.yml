name: Web strings

# Validates the local web UI strings (app/src/main/assets/web/app/strings/*.json) against the scripts that use them.
#   node scripts/check-web-strings.js --report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strings:
    name: Check the web strings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Compare the strings with the page
        run: node scripts/check-web-strings.js --report
