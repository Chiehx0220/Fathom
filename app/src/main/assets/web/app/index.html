  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/app.css?v={{version}}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vidstack@1.15.6/player/styles/default/theme.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vidstack@1.15.6/player/styles/default/layouts/video.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/vidstack@1.15.6/cdn/with-layouts/vidstack.js"></script>
  <style>
{{deviceColors}}
  </style>
  <script>
    // Applied before anything paints, so the chosen theme never flashes the default one.
    window.FT_CONFIG = { services: {{services}} };
    try {
      var root = document.documentElement;
      var theme = localStorage.getItem('fathom-theme');
      if (theme) root.dataset.theme = theme;
      var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      root.dataset.scheme = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>
<body data-route="" data-input="pointer">
  <header id="top"></header>
  <main id="screen" tabindex="-1"></main>
  <div id="stage" class="stage" hidden>
    <media-player id="player" class="stage-player" storage="fathom-player" crossorigin playsinline>
      <media-provider></media-provider>
      <media-video-layout></media-video-layout>
      <button type="button" id="skip-btn" class="skip-btn" hidden></button>
      <div id="hud" class="hud" hidden></div>
    </media-player>
    <div class="audio-art"><span class="i">music_note</span><strong id="audio-art-title"></strong></div>
    <button type="button" id="mini-close" class="mini-ctrl mini-close" aria-label="Close mini player" hidden><span class="i">close</span></button>
    <button type="button" id="mini-expand" class="mini-ctrl mini-expand" aria-label="Open full player" hidden><span class="i">fullscreen</span></button>
    <button type="button" id="mini-play" class="mini-ctrl mini-play" aria-label="Play/Pause" hidden></button>
  </div>
  <div id="layer">
    <div id="vptr" class="vptr" hidden><div class="vptr-halo"></div><div class="vptr-disc"><i></i></div></div>
    <div id="remote-banner" class="remote-banner" hidden></div>
    <div id="keyhints" class="keyhints" hidden></div>
    <div id="toast" class="toast" role="status"></div>
    <div id="menu" class="menu-root" hidden></div>
  </div>
  <script src="/app.js?v={{version}}"></script>
</body>
</html>
