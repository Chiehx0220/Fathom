<!DOCTYPE html>
<html lang="en" data-palette="fathom" data-scheme="light" data-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fathom</title>
  <!-- Active launcher icon, rendered by the app. -->
  <link rel="icon" type="image/png" href="/app-icon.png">
  <link rel="apple-touch-icon" href="/app-icon.png">
  <link rel="stylesheet" href="/app.css?v={{version}}">
  <!-- The player is Video.js 10, served from this device (assets/web/vendor/videojs; scripts/vendor-videojs.js updates it). Its modules are loaded by
       player-build.js when the first video opens; only the stylesheet that reserves the player's space is linked here. -->
  <link rel="stylesheet" href="/vendor/videojs/global.css?v={{version}}">
  <style>
{{deviceColors}}
  </style>
  <script>
    window.FT_CONFIG = { services: {{services}} };
    window.FT_STRINGS = {{strings}};
    // The theme is on <html> before anything paints, so the chosen one never flashes the default. theme.js changes it later
    // through the same function.
    window.FT_setTheme = function (palette, mode) {
      var root = document.documentElement;
      var dark = mode === 'auto' ? !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) : mode !== 'light';
      root.dataset.palette = palette;
      root.dataset.mode = mode;
      root.dataset.scheme = dark ? 'dark' : 'light';
      if (mode === 'oled') root.setAttribute('data-oled', ''); else root.removeAttribute('data-oled');
    };
    try {
      window.FT_setTheme(localStorage.getItem('fathom-palette') || 'fathom', localStorage.getItem('fathom-mode') || 'light');
    } catch (e) {}
  </script>
</head>
<body data-route="" data-input="pointer">
  <header id="top"></header>
  <main id="screen" tabindex="-1"></main>
  <div id="stage" class="stage" hidden>
    <!-- player-build.js builds the player of the open video in here: a Video.js player, its skin and the media component that fits the stream. -->
    <div id="player" class="stage-player"></div>
    <div class="audio-art"><span class="i">music_note</span><strong id="audio-art-title"></strong></div>
    <button type="button" id="mini-close" class="mini-ctrl mini-close" aria-label="Close mini player" data-t-label="mini_close" hidden><span class="i">close</span></button>
    <button type="button" id="mini-expand" class="mini-ctrl mini-expand" aria-label="Open full player" data-t-label="mini_expand" hidden><span class="i">fullscreen</span></button>
    <button type="button" id="mini-play" class="mini-ctrl mini-play" aria-label="Play/Pause" data-t-label="mini_play" hidden></button>
  </div>
  <!-- The skip button and the HUD sit inside the player's skin while a video is open, so they show in fullscreen; here between videos. -->
  <div id="overlay-holder" hidden>
    <button type="button" id="skip-btn" class="skip-btn" hidden></button>
    <div id="hud" class="hud" hidden></div>
  </div>
  <div id="layer">
    <div id="vptr" class="vptr" hidden><div class="vptr-halo"></div><div class="vptr-disc"><i></i></div></div>
    <div id="keyhints" class="keyhints" hidden></div>
    <div id="toast" class="toast" role="status"></div>
    <div id="menu" class="menu-root" hidden></div>
  </div>
  <script src="/app.js?v={{version}}"></script>
</body>
</html>
