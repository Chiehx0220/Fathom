<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Fathom</title>
<!-- Pairing page: standalone; only the launcher icon is served before pairing. -->
<link rel="icon" type="image/png" href="/app-icon.png">
<style>
:root { --bg: #F6F1E4; --card: #FFFCF4; --fg: #0F1D33; --mute: #56627A; --acc: #3F73D6; --err: #B3261E; --line: rgba(15, 29, 51, .16); color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --bg: #0B1524; --card: #12223A; --fg: #E8EEF6; --mute: #92A4BC; --acc: #7FA8F0; --err: #FF8A80; --line: rgba(232, 238, 246, .2); } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; overflow: hidden; background: var(--bg); color: var(--fg);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", sans-serif; }
.waves { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: 34vh; color: var(--acc); pointer-events: none; }
main { position: relative; width: min(380px, calc(100vw - 32px)); padding: 34px 26px 26px; border-radius: 28px; background: var(--card); text-align: center;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 18px 48px rgba(0, 0, 0, .14); }
.mark { width: 72px; height: 72px; margin: 0 auto 14px; display: block; }
h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: .01em; }
.sub { margin: 6px 0 22px; color: var(--mute); font-size: 15px; }
.code { position: relative; display: flex; justify-content: center; gap: 10px; }
.code span { width: 46px; height: 58px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 14px; font-size: 28px; font-weight: 600;
  font-variant-numeric: tabular-nums; transition: border-color .15s; }
.code span.fill { border-color: color-mix(in srgb, var(--acc) 50%, var(--line)); }
.code span.on { border-color: var(--acc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 22%, transparent); }
.code.err span { border-color: var(--err); box-shadow: none; }
.code input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; font-size: 16px; cursor: text; }
.shake { animation: shake .4s; }
@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
#m { min-height: 1.5em; margin: 16px 0 0; color: var(--err); font-size: 14px; }
#m.ok { color: var(--acc); }
@media (max-width: 360px) { .code { gap: 7px; } .code span { width: 40px; height: 52px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<svg class="waves" viewBox="0 0 1440 320" preserveAspectRatio="none" aria-hidden="true">
  <path fill="currentColor" fill-opacity=".12" d="M0,170C240,110 480,230 720,170C960,110 1200,230 1440,170L1440,320L0,320Z"/>
  <path fill="currentColor" fill-opacity=".2" d="M0,230C240,180 480,280 720,230C960,180 1200,280 1440,230L1440,320L0,320Z"/>
</svg>
<main>
  <img class="mark" src="/app-icon.png" alt="" width="72" height="72">
  <h1>Fathom</h1>
  <p class="sub" id="prompt"></p>
  <form id="b" class="code" onsubmit="return false" autocomplete="off">
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <input id="c" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" autofocus>
  </form>
  <p id="m" role="status" aria-live="polite"></p>
</main>
<script>
const WORDS = {
  en: { prompt: 'Enter the pairing code shown on your phone', ok: 'Paired', wrong: 'That code is not right', locked: 'Too many tries. Try again in {n} min', net: 'Could not reach the phone' },
  zh_Hant: { prompt: '輸入手機上顯示的配對碼', ok: '配對成功', wrong: '配對碼不正確', locked: '嘗試次數過多，請 {n} 分鐘後再試', net: '無法連線到手機' },
};
// First preferred language wins; Traditional Chinese tags → zh_Hant, unsupported → English.
const tags = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
const pickLang = () => {
  for (const tag of tags) {
    if (/^zh/i.test(tag) && /hant|tw|hk|mo/i.test(tag)) return 'zh_Hant';
    if (/^en/i.test(tag)) return 'en';
  }
  return 'en';
};
const lang = pickLang();
const T = WORDS[lang];
document.documentElement.lang = lang.replace('_', '-');

const form = document.getElementById('b'), input = document.getElementById('c'), message = document.getElementById('m');
const cells = [...form.children].filter((el) => el.tagName === 'SPAN');
document.getElementById('prompt').textContent = T.prompt;
input.setAttribute('aria-label', T.prompt);

let busy = false, focused = true;
const draw = () => cells.forEach((cell, n) => {
  cell.textContent = input.value[n] || '';
  cell.className = n < input.value.length ? 'fill' : focused && n === input.value.length ? 'on' : '';
});
const fail = (text) => {
  message.className = '';
  message.textContent = text;
  form.classList.add('err', 'shake');
  setTimeout(() => form.classList.remove('shake'), 400);
  input.value = '';
  busy = false;
  draw();
};
async function send() {
  busy = true;
  try {
    const response = await fetch('/pair?code=' + encodeURIComponent(input.value), { credentials: 'same-origin' });
    const body = await response.json().catch(() => ({}));
    if (response.ok) {
      message.className = 'ok';
      message.textContent = T.ok;
      setTimeout(() => location.reload(), 350);
    } else {
      fail(body.retryAfter ? T.locked.replace('{n}', Math.ceil(body.retryAfter / 60)) : T.wrong);
    }
  } catch (e) {
    fail(T.net);
  }
}
input.oninput = () => {
  if (busy) return;
  input.value = input.value.replace(/\D/g, '').slice(0, 6);
  message.textContent = '';
  form.classList.remove('err');
  draw();
  if (input.value.length === 6) send();
};
input.onfocus = () => { focused = true; draw(); };
input.onblur = () => { focused = false; draw(); };
draw();
</script>
</body>
</html>
